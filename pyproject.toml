[project]
name = "clipper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abhijeet Singh", email = "abhijeetsh5002@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.146.0",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "indic-transliteration>=2.3.82",
    "kokoro-onnx>=0.6.1",
    "mcp>=2.3.0",
    "mlx-whisper>=0.4.3",
    "numpy>=2.5.4",
    "opencv-python-headless>=4.10,<5",
    "pillow>=13.0.0",
    "pypdf>=6.21.1",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "soundfile>=0.14.0",
    "uvicorn>=0.54.0",
]


[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
